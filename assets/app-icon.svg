  <!-- Background shield shape -->
  <path d="M256 32C132.3 32 32 132.3 32 256c0 97.2 74.5 180.5 168.5 199.3V384h48v-28.7C405.5 434.5 480 352.2 480 256C480 132.3 379.7 32 256 32z" fill="url(#grad1)" filter="url(#glow)"/>
  
  <!-- Inner shield -->
  <path d="M256 64c88.4 0 160 71.6 160 160c0 70.4-45.2 131.2-108.8 153.3V352H256v-28.7C273.3 395.7 304 355.7 304 256C304 171.6 232.4 96 160 96S16 171.6 16 256c0 88.4 71.6 160 160 160c70.4 0 128-56.7 108.8-153.3V320h48v-28.7C340.5 291.7 374.5 251.7 374.5 256C374.5 151.7 288.3 64 256 64z" fill="url(#grad2)" opacity="0.3"/>
  
  <!-- Proxy symbol - two arrows crossing -->
  <g transform="translate(256 256)">
